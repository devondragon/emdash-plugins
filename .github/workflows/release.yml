name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      # OIDC trusted publishing needs npm >= 11.5.1. Node 24 already bundles a
      # newer npm (24.18 ships 11.16.0), so we rely on the bundled version.
      # Do NOT `npm install -g npm@latest` here: the current npm@latest hits
      # `Cannot find module 'sigstore'` during provenance signing (npm/cli#9722).
      - run: npm --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm run version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
